# Persistent storage for the Wordle/Fibble project on NRP.
#   wordle-work   : code checkout, Python venv, results (used by the dev pod)
#   wordle-ollama : downloaded open-weight models (used by the Ollama pod)
# Block volumes attach to one node at a time, so each pod gets its own.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordle-work
  namespace: gilpin-lab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordle-ollama
  namespace: gilpin-lab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 40Gi
