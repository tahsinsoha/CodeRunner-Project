# CPU pod for running code, tests, PPO/DQN training and evaluations.
# It stops by itself after 12 hours (activeDeadlineSeconds); files on
# /work survive. To start a fresh one later, change metadata.name
# (e.g. wordle-dev-2) and apply again.
apiVersion: v1
kind: Pod
metadata:
  name: wordle-dev
  namespace: gilpin-lab
spec:
  activeDeadlineSeconds: 43200
  restartPolicy: Never
  containers:
    - name: dev
      image: python:3.12-slim
      command: ["sleep", "infinity"]
      workingDir: /work
      env:
        - name: OLLAMA_HOST
          value: "http://wordle-ollama:11434"
      envFrom:
        - secretRef:
            name: wordle-llm-keys
            optional: true
      resources:
        requests:
          cpu: "8"
          memory: 16Gi
        limits:
          cpu: "8"
          memory: 16Gi
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      persistentVolumeClaim:
        claimName: wordle-work
